[project]
name = "promote-or-hold"
version = "0.1.0"
description = "Promotion gates for tool-using agents: wrong promotions versus evaluation cost on tau2-bench's recorded trials"
requires-python = ">=3.14"
dependencies = ["numpy==2.5.4"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["promote_or_hold"]
